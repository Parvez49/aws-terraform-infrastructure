name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Terraform environment"
        required: true
        type: choice
        options:
          - dev
          - staging

      confirmation:
        description: "Type APPLY to confirm deployment"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: terraform-apply-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Apply - ${{ inputs.environment }}
    runs-on: ubuntu-latest

    if: inputs.confirmation == 'APPLY'

    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: environments/${{ inputs.environment }}

      - name: Terraform Apply
        run: terraform apply -input=false -no-color tfplan