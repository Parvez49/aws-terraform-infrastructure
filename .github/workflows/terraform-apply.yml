name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Terraform environment"
        required: true
        type: choice
        options:
          - dev
          - staging

      plan_run_id:
        description: "GitHub Actions run ID that generated the Terraform plan"
        required: true
        type: string

      confirmation:
        description: "Type APPLY to confirm deployment"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: terraform-apply-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Apply - ${{ inputs.environment }}
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}

    steps:
      # These two run before checkout, so the job-level working-directory
      # (environments/<env>) does not exist yet — override it to the workspace.
      - name: Validate Confirmation
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ inputs.confirmation }}" != "APPLY" ]; then
            echo "Invalid confirmation. You must type APPLY."
            exit 1
          fi

      - name: Validate Plan Run ID
        working-directory: ${{ github.workspace }}
        run: |
          if ! [[ "${{ inputs.plan_run_id }}" =~ ^[0-9]+$ ]]; then
            echo "Invalid GitHub Actions run ID."
            exit 1
          fi

      - name: Verify Plan Workflow Run
        id: plan-run
        uses: actions/github-script@v7
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = Number(process.env.PLAN_RUN_ID);

            const workflow = await github.rest.actions.getWorkflow({
              owner,
              repo,
              workflow_id: "terraform-plan.yml"
            });

            const response = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: runId
            });

            const run = response.data;

            if (run.workflow_id !== workflow.data.id) {
              throw new Error("The supplied run ID does not belong to terraform-plan.yml.");
            }

            if (run.event !== "push") {
              throw new Error("Only plans generated by a push event are accepted.");
            }

            if (run.head_branch !== "main") {
              throw new Error("Only plans generated from main are accepted.");
            }

            if (run.status !== "completed" || run.conclusion !== "success") {
              throw new Error("The Terraform Plan workflow did not complete successfully.");
            }

            core.setOutput("head_sha", run.head_sha);

            core.info(`Verified plan run: ${run.id}`);
            core.info(`Source commit: ${run.head_sha}`);

      - name: Checkout Plan Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan-run.outputs.head_sha }}

      # Applying a saved plan does not re-evaluate variables, but init still
      # loads them. Exported conditionally for the same reason as in
      # terraform-plan.yml: an empty TF_VAR_ breaks init with a misleading
      # "Missing expression" HCL error.
      - name: Resolve ssh_cidrs
        env:
          # Accepts either form. Use the secret rather than the variable if the
          # repository is public: secrets are masked in job logs, variables are
          # printed in plain text, and these are home IP addresses.
          SSH_CIDRS: ${{ vars.SSH_CIDRS || secrets.SSH_CIDRS }}
        run: |
          if ! grep -qr 'variable "ssh_cidrs"' . ; then
            echo "This root does not declare ssh_cidrs, nothing to export."
            exit 0
          fi

          if [ -z "$SSH_CIDRS" ]; then
            echo "::error::Repository variable SSH_CIDRS is not set. Add it under" \
                 "Settings > Secrets and variables > Actions > Variables as a JSON" \
                 "list, for example [\"203.0.113.4/32\"]."
            exit 1
          fi

          if ! echo "$SSH_CIDRS" | jq -e 'type == "array" and length > 0' > /dev/null 2>&1; then
            echo "::error::SSH_CIDRS must be a non-empty JSON array, for example" \
                 "[\"203.0.113.4/32\"]. Got: $SSH_CIDRS"
            exit 1
          fi

          echo "TF_VAR_ssh_cidrs=$SSH_CIDRS" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: environments/${{ inputs.environment }}

      - name: Verify Plan File
        run: |
          if [ ! -f tfplan ]; then
            echo "Terraform plan artifact not found."
            exit 1
          fi

      - name: Terraform Apply
        run: terraform apply -input=false -no-color tfplan
