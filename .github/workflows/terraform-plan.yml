name: Terraform Plan

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars.example"
      - "**/.terraform.lock.hcl"
      - ".github/workflows/**"

  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tfvars.example"
      - "**/.terraform.lock.hcl"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  terraform-plan:
    name: Terraform Plan - ${{ matrix.environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - staging

    concurrency:
      group: terraform-state-${{ matrix.environment }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # TF_VAR_ssh_cidrs is exported here rather than as a job-level env var.
      # A job-level `TF_VAR_ssh_cidrs: ${{ vars.SSH_CIDRS }}` renders to an
      # empty string when the variable is unset, and Terraform then fails
      # parsing "" as HCL with a misleading "Missing expression" error during
      # init. Exporting it only when it is actually set keeps the failure clear.
      - name: Resolve ssh_cidrs
        env:
          # Accepts either form. Use the secret rather than the variable if the
          # repository is public: secrets are masked in job logs, variables are
          # printed in plain text, and these are home IP addresses.
          SSH_CIDRS: ${{ vars.SSH_CIDRS || secrets.SSH_CIDRS }}
        run: |
          if ! grep -qr 'variable "ssh_cidrs"' . ; then
            echo "This root does not declare ssh_cidrs, nothing to export."
            exit 0
          fi

          if [ -z "$SSH_CIDRS" ]; then
            echo "::error::Repository variable SSH_CIDRS is not set. Add it under" \
                 "Settings > Secrets and variables > Actions > Variables as a JSON" \
                 "list, for example [\"203.0.113.4/32\"]."
            exit 1
          fi

          if ! echo "$SSH_CIDRS" | jq -e 'type == "array" and length > 0' > /dev/null 2>&1; then
            echo "::error::SSH_CIDRS must be a non-empty JSON array, for example" \
                 "[\"203.0.113.4/32\"]. Got: $SSH_CIDRS"
            exit 1
          fi

          echo "TF_VAR_ssh_cidrs=$SSH_CIDRS" >> "$GITHUB_ENV"
          echo "Exported TF_VAR_ssh_cidrs with $(echo "$SSH_CIDRS" | jq 'length') CIDR(s)."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: Upload Terraform Plan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.environment }}
          path: environments/${{ matrix.environment }}/tfplan
          retention-days: 1